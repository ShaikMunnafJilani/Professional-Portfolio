<h2>My Full-Stack Portfolio</h2>
<p class="subtitle">Showcasing the blend of Spring Boot, Angular, and robust Java solutions.</p>

<div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>

<div class="projects-grid">
    <div class="project-card" *ngFor="let project of projects">
        <h3 class="project-title">{{ project.title }}</h3>
        <p class="project-description">{{ project.description }}</p>
        
        <div class="tech-stack">
            <span class="tech-tag" *ngFor="let tech of project.technologies">{{ tech }}</span>
        </div>

        <div class="project-links">
            <a [href]="project.githubUrl" target="_blank" class="btn btn-github">
                <i class="fas fa-code-branch"></i> Code
            </a>
            <a *ngIf="project.liveDemoUrl && project.liveDemoUrl !== '#'" [href]="project.liveDemoUrl" target="_blank" class="btn btn-live">
                <i class="fas fa-external-link-alt"></i> Live Demo
            </a>
        </div>
    </div>
</div>
